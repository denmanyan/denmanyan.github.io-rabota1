<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Игра Drag & Drop</title>
    <style>
        body {
            font-family: sans-serif;
            background: #2c3e50;
            color: #fff;
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        .panel {
            background: #34495e;
            padding: 15px;
            border-radius: 8px;
            width: 200px;
        }

        .inv {
            min-height: 100px;
            border: 2px dashed #7f8c8d;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

            button:hover {
                background: #c0392b;
            }

        #dice {
            font-size: 22px;
            color: #f1c40f;
            text-align: center;
            margin: 10px 0 0;
        }

        .board {
            position: relative;
            width: 660px;
            height: 350px;
            background: #ecf0f1;
            border-radius: 8px;
        }

        .cell {
            position: absolute;
            width: 80px;
            height: 80px;
            background: #fff;
            border: 2px solid #34495e;
            border-radius: 8px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #7f8c8d;
            font-weight: bold;
        }

            .cell.drag-over {
                background: #d1f2eb;
                border-color: #1abc9c;
            }

            .cell.special {
                background: #fcf3cf;
                border-color: #f1c40f;
                color: #d35400;
            }

            .cell img {
                width: 35px;
                height: 35px;
                margin-bottom: 3px;
            }

        .token {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 60px;
            height: 60px;
            cursor: grab;
            z-index: 10;
        }

            .token img {
                width: 100%;
                height: 100%;
                filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.5));
            }

        .log {
            margin-top: 15px;
            width: 660px;
            height: 100px;
            background: #fff;
            color: #333;
            border-radius: 8px;
            padding: 10px;
            box-sizing: border-box;
            overflow-y: auto;
            font-size: 14px;
        }

            .log p {
                margin: 3px 0;
            }

            .log .warn {
                color: #c0392b;
                font-weight: bold;
            }

            .log .succ {
                color: #27ae60;
                font-weight: bold;
            }

            .log .info {
                color: #2980b9;
            }
    </style>
</head>
<body>

    <!-- Левая панель -->
    <div class="panel">
        <h3>Инвентарь</h3>
        <div class="inv" id="inv">
            <div class="token" id="token" draggable="true">
                <img src="https://cdn-icons-png.flaticon.com/512/2922/2922510.png" alt="Игрок">
            </div>
        </div>
        <h3>Кубик</h3>
        <button onclick="roll()">Бросить</button>
        <p id="dice">-</p>
    </div>

    <!-- Игровое поле -->
    <div>
        <div class="board" id="board">
            <div class="cell" style="top:30px; left:30px;" data-id="1"><img src="https://cdn-icons-png.flaticon.com/512/2553/2553691.png">Старт</div>
            <div class="cell" style="top:30px; left:120px;" data-id="2">2</div>
            <div class="cell special" style="top:30px; left:210px;" data-id="3"><img src="https://cdn-icons-png.flaticon.com/512/564/564619.png">Ловушка</div>
            <div class="cell" style="top:120px; left:210px;" data-id="4">4</div>
            <div class="cell" style="top:210px; left:210px;" data-id="5">5</div>
            <div class="cell special" style="top:210px; left:300px;" data-id="6"><img src="https://cdn-icons-png.flaticon.com/512/1077/1077976.png">Бонус</div>
            <div class="cell" style="top:210px; left:390px;" data-id="7">7</div>
            <div class="cell" style="top:120px; left:390px;" data-id="8">8</div>
            <div class="cell special" style="top:30px; left:390px;" data-id="9"><img src="https://cdn-icons-png.flaticon.com/512/1828/1828665.png">Пропуск</div>
            <div class="cell" style="top:30px; left:480px;" data-id="10">10</div>
            <div class="cell special" style="top:30px; left:570px;" data-id="11"><img src="https://cdn-icons-png.flaticon.com/512/616/616494.png">Финиш</div>
        </div>

        <!-- Логи -->
        <div class="log" id="log"><p class="info">Перетащите фишку на поле.</p></div>
    </div>

    <script>
    const token = document.getElementById('token');
    const cells = document.querySelectorAll('.cell');
    const log = document.getElementById('log');
    const inv = document.getElementById('inv');

    // --- DRAG AND DROP ---
    token.addEventListener('dragstart', e => {
        e.dataTransfer.setData('text', token.id);
        setTimeout(() => token.style.opacity = '0.5', 0);
    });
    token.addEventListener('dragend', () => token.style.opacity = '1');

    // Настройка клеток
    cells.forEach(cell => {
        cell.addEventListener('dragover', e => {
            e.preventDefault();
            cell.classList.add('drag-over');
        });
        cell.addEventListener('dragleave', () => cell.classList.remove('drag-over'));

        cell.addEventListener('drop', e => {
            e.preventDefault();
            cell.classList.remove('drag-over');

            // Перемещаем фишку в клетку
            cell.appendChild(token);
            token.style.top = '10px';
            token.style.left = '10px';

            const name = cell.innerText.trim();

            // Проверка на уникальную клетку
            if (cell.classList.contains('special')) {
                addLog(`Вы попали на уникальную клетку: "${name}"!`, 'warn');
                if (name === 'Бонус') addLog('+1 к следующему броску!', 'succ');
                if (name === 'Ловушка') addLog('Вы теряете ход!', 'warn');
                if (name === 'Пропуск') addLog('Вы пропускаете ход!', 'warn');
                if (name === 'Финиш') addLog('Вы победили!', 'succ');
            } else {
                addLog(`Фишка на клетке ${cell.dataset.id}.`, 'info');
            }
        });
    });

    // Возврат фишки в инвентарь
    inv.addEventListener('dragover', e => e.preventDefault());
    inv.addEventListener('drop', e => {
        e.preventDefault();
        inv.appendChild(token);
        addLog('Фишка в инвентаре.', 'info');
    });

    // --- КУБИК ---
    function roll() {
        const res = Math.floor(Math.random() * 6) + 1;
        document.getElementById('dice').innerText = res;
        addLog(`🎲 Выпало: ${res}`, 'info');
    }

    // --- ЛОГИ ---
    function addLog(text, type) {
        const p = document.createElement('p');
        p.className = type;
        p.innerText = text;
        log.appendChild(p);
        log.scrollTop = log.scrollHeight;
    }
    </script>
</body>
</html>
